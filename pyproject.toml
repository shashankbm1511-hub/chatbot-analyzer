[project]
name = "chatbot-analyzer"
version = "0.1.0"
description = "Conversational analytics & intelligence platform for chatbot conversations (portfolio prototype)."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
